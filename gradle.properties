# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process with G1GC
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Limita o número de workers simultâneos durante a compilação
org.gradle.workers.max=4

# Habilita o Build Cache local do Gradle para reaproveitar tarefas inalteradas
org.gradle.caching=true

# Faz o compilador do Kotlin rodar no mesmo processo do Gradle em vez de subir outro Java
kotlin.compiler.execution.strategy=in-process

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration has changed.
org.gradle.configuration-cache=true

# Kotlin code style for this project:
kotlin.code.style=official
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
